<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boschor Map</title>
<meta name="theme-color" content="#1f3a52">
<meta name="description" content="Boschor Map – Touren, Gipfel und Orte in der Schweiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>

  <symbol id="c-gipfel" viewBox="0 0 24 24"><path d="M2.5 20.5L12 5l9.5 15.5z"/><path d="M12 1v5M10 2.8h4" stroke-linecap="round"/></symbol>
  <symbol id="c-huette" viewBox="0 0 24 24"><path d="M3 12L12 4l9 8M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/></symbol>
  <symbol id="c-pass" viewBox="0 0 24 24"><path d="M2 19c3-9 6-12 8-12 1.5 0 1.5 4 2 4s.5-4 2-4c2 0 5 3 8 12"/></symbol>
  <symbol id="c-see" viewBox="0 0 24 24"><path d="M3 10c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></symbol>
  <symbol id="c-ort" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4l-5.3 3 1.2-6-4.5-4.1 6-.7z"/></symbol>
  <symbol id="c-start" viewBox="0 0 24 24"><path d="M8 20V4h5a4.5 4.5 0 010 9H8"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14 5.3M4 12A8 8 0 0118 6.7"/><path d="M18 2v5h-5M6 22v-5h5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 00-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 19h7a3.5 3.5 0 000-7h-4a3.5 3.5 0 010-7h7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>

  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V8M6 14l6-6 6 6M4 4h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4l-5.3 3 1.2-6-4.5-4.1 6-.7z"/></symbol>
  <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-8 6 6 0 00-11.4 1.5A3.3 3.3 0 007 18z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1116 0"/><path d="M12 18l4-6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-gpx" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M8 15l3-3 2 2 3-4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
 </defs>
</svg>

<header id="top">
  <button class="ib" id="bMenu" aria-label="Menü"><svg><use href="#i-menu"/></svg></button>
  <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><b>Boschor Map</b><span id="ver"></span></div>
  <button class="ib" id="bSearch" aria-label="Suchen"><svg><use href="#i-search"/></svg></button>
  <button class="ib" id="bSync" aria-label="Abgleichen" hidden><svg><use href="#i-sync"/></svg><i class="dot"></i></button>
</header>

<main id="mapWrap">
  <div id="map"></div>
  <div class="mapbtns bm-ui">
    <button class="fb" id="bLayers" aria-label="Karten und Ebenen"><svg><use href="#i-layers"/></svg></button>
    <button class="fb" id="bZin" aria-label="Hineinzoomen"><svg><use href="#i-plus"/></svg></button>
    <button class="fb" id="bZout" aria-label="Herauszoomen"><svg><use href="#i-minus"/></svg></button>
    <button class="fb" id="bLoc" aria-label="Mein Standort"><svg><use href="#i-locate"/></svg></button>
    <button class="fb acc" id="bAdd" aria-label="Punkt setzen"><svg><use href="#i-pin"/></svg></button>
  </div>
  <div id="cross" hidden><div class="cx"></div></div>
  <div id="modebar" class="bm-ui" hidden></div>
  <div id="dlpill" class="bm-ui" hidden></div>
  <div id="attr">© swisstopo</div>
</main>

<nav id="bar">
  <button data-go="points"><svg><use href="#i-list"/></svg><span>Orte</span></button>
  <button data-go="tours"><svg><use href="#i-route"/></svg><span>Touren</span></button>
  <button data-go="plan"><svg><use href="#i-flag"/></svg><span>Planen</span></button>
  <button data-go="weekend"><svg><use href="#i-sun"/></svg><span>Wochenende</span></button>
  <button data-go="more"><svg><use href="#i-more"/></svg><span>Mehr</span></button>
</nav>

<section id="sheet" aria-hidden="true"><div id="panel"></div></section>
<div id="toast"></div>
<div id="prog" hidden><b id="progT"></b><div class="bar"><i id="progB"></i></div><small id="progS"></small></div>
<input type="file" id="fGpx" accept=".gpx,application/gpx+xml,application/octet-stream" multiple hidden>
<input type="file" id="fPhotos" accept="image/*" multiple hidden>
<input type="file" id="fFolder" webkitdirectory multiple hidden>
<input type="file" id="fBackup" accept=".json,application/json" hidden>
<input type="file" id="fPtPhoto" accept="image/*" multiple hidden>

<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/gpx.js"></script>
<script src="js/app.js"></script>
<script src="js/tours.js"></script>
<script src="js/offline.js"></script>
<script src="js/sync.js"></script>
<script src="js/admin.js"></script>
<script>bootApp();</script>
</body>
</html>
